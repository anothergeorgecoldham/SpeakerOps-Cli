name: Your Name
role: Your Role

bio:
  short: Add a one-line introduction for your speaking profile.
  perspective: Describe how you approach technical talks and practical trade-offs.

interests:
  primary:
    - Zero Trust
    - AI Security
    - Platform Engineering
    - Developer Experience
  secondary:
    - Open source tooling
    - Community speaking
    - Software architecture
    - Incident response

audience_preferences:
  preferred_audiences:
    - security architects
    - cloud engineers
    - platform teams
    - technical community audiences

tone:
  style:
    - calm
    - practical
    - evidence-based
  avoid:
    - hype
    - emojis
    - fearmongering
    - vendor theatre

speaking_style:
  strengths:
    - clear explanations
    - practical framing
    - connecting security strategy to implementation
  preferences:
    - use simple demos
    - explain trade-offs
    - avoid overclaiming
    - prefer useful patterns over abstract theory

point_of_view:
  - Security should enable delivery, not block it.
  - Focus on practical lessons people can apply this week.
  - Explain trade-offs and assumptions clearly.
  - Keep examples concrete and reproducible.

model_provider: local
model: local-draft

network:
  mode: allowlist
  allowed_domains:
    - learn.microsoft.com
    - docs.github.com
    - nist.gov
    - mitre.org
    - owasp.org

paths:
  deny:
    - ".env"
    - ".env.*"
    - "*.pem"
    - "*.key"
    - "id_rsa"
    - "id_ed25519"
    - ".ssh/*"
    - ".git/config"
    - ".git-credentials"

security:
  hardened: true
  allowed_operators: []
  scan_generated_content: true
  provenance_enabled: true
