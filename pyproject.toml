[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speakerops"
version = "0.1.0"
description = "Unsafe MVP CLI for developing technical speaking artefacts."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.scripts]
speakerops = "speakerops.cli:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["speakerops*"]

[tool.setuptools.package-data]
speakerops = ["templates/*.yaml"]
